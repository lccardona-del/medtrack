<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <!-- Fondo con esquinas redondeadas estilo Clinical Precision UI -->
  <rect width="64" height="64" rx="16" fill="url(#medtrack-bg)" />
  
  <!-- Tarjeta posterior sutil (efecto flashcard / capas de estudio) -->
  <rect x="15" y="10" width="34" height="42" rx="8" fill="#ffffff" fill-opacity="0.25" transform="rotate(8 32 31)" />
  
  <!-- Tarjeta principal frontal -->
  <rect x="14" y="11" width="36" height="42" rx="8" fill="#ffffff" filter="url(#card-shadow)" />

  <!-- Cruz médica en azul clínico -->
  <path d="M32 20V38M23 29H41" stroke="#006194" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Acento de precisión / pulso en verde menta Stitch -->
  <path d="M22 44C25 44 27 42 29 45L31.5 40L33.5 47L36 44H42" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Filtros y gradientes -->
  <defs>
    <linearGradient id="medtrack-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007bb9" />
      <stop offset="100%" stop-color="#006194" />
    </linearGradient>
    <filter id="card-shadow" x="10" y="9" width="44" height="50" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1c30" flood-opacity="0.15" />
    </filter>
  </defs>
</svg>
